name: refresh

# 客户端 BackupPayloadCodec 只接受 ts 在 24 小时内的载荷。
# 不自动刷新 = 发布第二天起这条兜底通道就静默失效（巡检会报，但那时已经晚了）。
# 每 6 小时重签一次，给 24h 窗口留 4 倍容错。
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 重新签名（只刷新 ts，域名内容 builtAt 保持不变）
        env:
          KEY: ${{ secrets.DOMAINS_SIGN_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${KEY:-}" ]; then echo "缺少 secret DOMAINS_SIGN_SECRET"; exit 1; fi
          node - <<'JS'
          const fs = require('fs');
          const crypto = require('crypto');
          const key = process.env.KEY;
          const path = 'fallback.json';
          const c = JSON.parse(fs.readFileSync(path, 'utf8'));
          const ts = Date.now();
          const s = crypto
            .createHmac('sha256', key)
            .update(`backup|v1|${ts}|${c.d}`, 'utf8')
            .digest('base64url');
          const next = { v: 1, ts, d: c.d, s, builtAt: c.builtAt ?? c.ts };
          fs.writeFileSync(path, JSON.stringify(next) + '\n');
          // 自检：解回来验一遍，避免把坏载荷推上去
          const want = crypto.createHmac('sha256', key).update(`backup|v1|${ts}|${next.d}`, 'utf8').digest('base64url');
          if (want !== next.s) { console.error('自检失败'); process.exit(1); }
          console.log(`重新签名完成 ts=${new Date(ts).toISOString()} builtAt=${new Date(next.builtAt).toISOString()}`);
          JS

      - name: 单提交快照推送（保持远端只有 1 个提交）
        run: |
          set -euo pipefail
          git config user.name  "refresh-bot"
          git config user.email "refresh-bot@users.noreply.github.com"
          if git diff --quiet -- fallback.json; then
            echo "内容未变化，跳过"
            exit 0
          fi
          git add -A
          git commit --amend --no-edit
          git push --force origin HEAD:main

      - name: 清 jsDelivr 缓存
        run: |
          curl -fsS --max-time 20 \
            "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/fallback.json" || true
